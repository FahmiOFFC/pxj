<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pino Linktree</title>
<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
}
.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:auto;
    display:block;
}
h1{
    margin:15px 0 5px;
}
p{
    color:#bdbdbd;
}
.link{
    display:block;
    background:#1e293b;
    color:white;
    text-decoration:none;
    padding:15px;
    margin:12px auto;
    max-width:350px;
    border-radius:12px;
    transition:.2s;
}
.link:hover{
    transform:scale(1.03);
}
</style>
</head>
<body>

<img class="profile" src="https://i.imgur.com/8Km9tLL.png">

<h1>PINO</h1>
<p>Welcome To My Links</p>

<a class="link" href="https://www.tiktok.com" target="_blank">TikTok</a>
<a class="link" href="https://www.youtube.com" target="_blank">YouTube</a>
<a class="link" href="https://discord.com" target="_blank">Discord</a>
<a class="link" href="https://github.com" target="_blank">GitHub</a>

</body>
</html>
